<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgFlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="60%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#010206"/>
    </radialGradient>
    <linearGradient id="goldCyanRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f5e6ab"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <filter id="flightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgFlight)" stroke="url(#goldCyanRim)" stroke-width="8"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 6"/>

  <!-- Flight Recorder Capsule Chassis -->
  <rect x="110" y="130" width="292" height="252" rx="36" fill="#060b17" stroke="url(#goldCyanRim)" stroke-width="6"/>

  <!-- Dual Tape Reels (Black Box Spools) -->
  <circle cx="190" cy="210" r="46" fill="#0d182e" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="190" cy="210" r="16" fill="url(#tapeGrad)"/>
  <circle cx="322" cy="210" r="46" fill="#0d182e" stroke="#d4af37" stroke-width="4"/>
  <circle cx="322" cy="210" r="16" fill="url(#tapeGrad)"/>

  <!-- Magnetic Tape / Scrub Ribbon Path -->
  <path d="M 190 256 C 220 280 292 280 322 256" fill="none" stroke="#f5e6ab" stroke-width="4" stroke-linecap="round"/>

  <!-- Telemetry Waveform Track -->
  <path d="M 140 330 L 190 330 L 210 305 L 230 355 L 250 295 L 270 345 L 290 320 L 310 330 L 372 330" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#flightGlow)"/>

  <!-- Blinking REC Indicator -->
  <circle cx="360" cy="165" r="9" fill="#ef4444" filter="url(#flightGlow)"/>
  <circle cx="360" cy="165" r="4" fill="#ffffff"/>

  <!-- Timecode Scrub Index Marker -->
  <polygon points="256,155 248,175 264,175" fill="#d4af37" filter="url(#flightGlow)"/>
</svg>
