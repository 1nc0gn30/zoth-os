<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d220a"/>
      <stop offset="60%" stop-color="#120e04"/>
      <stop offset="100%" stop-color="#040301"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)" stroke="url(#goldRim)" stroke-width="8"/>
  <!-- Orbital Conductor Mesh Rings -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="95" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 6"/>
  <!-- 4 Satellite Daemon Nodes (Firewall, Sentinel, Mock Twin, Neuro-Memory) -->
  <!-- Top Node: Firewall (Crimson) -->
  <line x1="256" y1="256" x2="256" y2="106" stroke="#f43f5e" stroke-width="3" stroke-opacity="0.7"/>
  <circle cx="256" cy="106" r="18" fill="#1a0508" stroke="#f43f5e" stroke-width="4"/>
  <circle cx="256" cy="106" r="7" fill="#f43f5e" filter="url(#glow)"/>
  <!-- Right Node: Sentinel (Emerald) -->
  <line x1="256" y1="256" x2="406" y2="256" stroke="#00ff9d" stroke-width="3" stroke-opacity="0.7"/>
  <circle cx="406" cy="256" r="18" fill="#021a12" stroke="#00ff9d" stroke-width="4"/>
  <circle cx="406" cy="256" r="7" fill="#00ff9d" filter="url(#glow)"/>
  <!-- Bottom Node: Mock Twin (Purple) -->
  <line x1="256" y1="256" x2="256" y2="406" stroke="#c084fc" stroke-width="3" stroke-opacity="0.7"/>
  <circle cx="256" cy="406" r="18" fill="#180726" stroke="#c084fc" stroke-width="4"/>
  <circle cx="256" cy="406" r="7" fill="#c084fc" filter="url(#glow)"/>
  <!-- Left Node: Neuro-Memory (Cyan) -->
  <line x1="256" y1="256" x2="106" y2="256" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.7"/>
  <circle cx="106" cy="256" r="18" fill="#051726" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="106" cy="256" r="7" fill="#38bdf8" filter="url(#glow)"/>
  <!-- Sovereign Conductor Diamond Star Core -->
  <polygon points="256,196 274,238 316,256 274,274 256,316 238,274 196,256 238,238" fill="url(#goldRim)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="16" fill="#00f3ff" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="7" fill="#ffffff"/>
</svg>
