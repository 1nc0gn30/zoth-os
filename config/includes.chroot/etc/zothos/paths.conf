# Optional ZothOS path and contact overrides.
# Sourced by /etc/zothos/paths.sh and read by systemd
# (EnvironmentFile=-/etc/zothos/paths.conf). Leave a variable unset to keep the
# default. Do not commit real phone numbers, disk serials, or filesystem UUIDs.
#
# ZOTH_USER=zoth
# AZOTH_USER=azoth
# ZOTH_HOME=/home/youruser
# ZOTH_SRC_ROOT=/path/to/NullAITech
# ZOTH_SIGNAL_NUMBER=+E164
# ZOTH_PARROT_DISK=/dev/disk/by-id/your-parrot-disk
# ZOTH_PARROT_RAM=12G
# ZOTH_PARROT_CPUS=8
