---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false

allowWeakPasswords: true
allowWeakPasswordsDefault: true

passwordRequirements:
    nonempty: true
    minLength: 1
    maxLength: -1
