[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anderson-security-sentinel"
version = "2.6.0"
description = "Autonomous biometric workstation perimeter defense, 802.11 RF tomography, USB/BLE tripwire, and SHA-256 forensic dossier daemon"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Neal Frazier (Neal Frazier Tech)", email = "1nc0gn30@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Multimedia :: Video :: Capture"
]
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "edge-tts>=7.0.0",
    "pydantic>=2.0.0"
]

[project.scripts]
anderson-sentinel = "run:main"
anderson-security-sentinel = "server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "web*"]
