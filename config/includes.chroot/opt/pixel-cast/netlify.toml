[build]
  publish = "public"
  command = "echo 'PixelCast Sovereign Workstation ready'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self)"

[[redirects]]
  from = "/mobile"
  to = "/mobile.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
