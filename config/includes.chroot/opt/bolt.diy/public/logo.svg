<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6AB" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA8010" />
      <stop offset="100%" stop-color="#705206" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181F" />
      <stop offset="100%" stop-color="#08080B" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" stroke="#D4AF37" stroke-width="2.5" stroke-opacity="0.4"/>
  <!-- Elegant Imperial Z Monogram -->
  <path d="M 28 28 L 72 28 L 38 72 L 72 72" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)"/>
  <circle cx="50" cy="50" r="2.5" fill="#F5E6AB" opacity="0.8"/>
</svg>
