<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZOTH TOOL NEXUS PRO // 153+ CYBER ARSENAL & SOVEREIGN RUNTIMES</title>
  <style>
    :root {
      --bg: #04070c;
      --bg-alt: #080d15;
      --panel: rgba(10, 16, 26, 0.94);
      --card: rgba(14, 22, 35, 0.82);
      --card-hover: rgba(0, 229, 255, 0.08);
      --border: rgba(0, 229, 255, 0.18);
      --border-gold: rgba(255, 215, 0, 0.38);
      --border-bright: rgba(255, 215, 0, 0.75);
      --primary: #00e5ff;
      --secondary: #00ff9d;
      --gold: #ffd700;
      --gold-dim: #cca800;
      --purple: #a855f7;
      --red: #ff3355;
      --yellow: #ffb800;
      --text: #f1f5f9;
      --text-dim: #7d90a0;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace, 'Noto Color Emoji';
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Ambient background grid */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 12% 15%, rgba(255, 215, 0, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 88% 85%, rgba(0, 229, 255, 0.05) 0%, transparent 40%),
        linear-gradient(rgba(255, 215, 0, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 215, 0, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    header {
      position: relative;
      z-index: 10;
      padding: 10px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border-gold);
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.7);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 28px;
      color: var(--gold);
      text-shadow: 0 0 16px rgba(255, 215, 0, 0.6);
      animation: pulse-glow 3s infinite alternate;
    }

    @keyframes pulse-glow {
      0% { filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.3)); }
      100% { filter: drop-shadow(0 0 14px rgba(255, 215, 0, 0.8)); }
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--gold);
    }

    .brand-sub {
      font-size: 9px;
      color: var(--primary);
      letter-spacing: 1.5px;
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.65);
      padding: 7px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      width: 320px;
      transition: all 0.25s;
    }

    .search-bar:focus-within {
      border-color: var(--gold);
      box-shadow: 0 0 14px rgba(255, 215, 0, 0.35);
      width: 380px;
    }

    .search-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
      width: 100%;
      user-select: text;
    }

    .search-input::placeholder { color: var(--text-dim); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 5px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.25);
    }

    .btn-master {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.25), rgba(255, 170, 0, 0.12));
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 7px 16px;
      box-shadow: 0 0 16px rgba(255, 215, 0, 0.3);
    }

    .btn-master:hover {
      background: var(--gold);
      color: #000;
      box-shadow: 0 0 24px rgba(255, 215, 0, 0.7);
      transform: translateY(-1px);
    }

    /* Subheader & Telemetry Bar */
    .tele-bar {
      position: relative;
      z-index: 5;
      background: rgba(8, 12, 18, 0.90);
      border-bottom: 1px solid rgba(255, 215, 0, 0.18);
      padding: 8px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
    }

    .tele-metrics {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .tele-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-dim);
    }

    .tele-val {
      font-weight: 800;
      color: var(--text);
    }

    .tele-val.green { color: var(--secondary); text-shadow: 0 0 8px rgba(0, 255, 157, 0.4); }
    .tele-val.gold { color: var(--gold); text-shadow: 0 0 8px rgba(255, 215, 0, 0.4); }
    .tele-val.red { color: var(--red); }

    .status-filters {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-dim);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 9px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-chip:hover {
      color: var(--text);
      border-color: var(--primary);
    }

    .filter-chip.active {
      background: rgba(0, 229, 255, 0.12);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 700;
    }

    /* Filter Tabs Bar */
    .tabs-bar {
      position: relative;
      z-index: 5;
      background: var(--bg-alt);
      border-bottom: 1px solid var(--border);
      padding: 6px 20px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs-bar::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      padding: 6px 12px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
    }

    .tab-btn.active {
      color: var(--gold);
      border-color: var(--gold);
      background: rgba(255, 215, 0, 0.08);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.15);
    }

    /* Main Container */
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    /* Grid Layout */
    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 14px;
      padding-bottom: 30px;
    }

    /* Tool Card */
    .tool-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(8px);
      position: relative;
      overflow: hidden;
    }

    .tool-card:hover {
      border-color: var(--gold);
      background: var(--card-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 12px rgba(255, 215, 0, 0.15);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 8px;
    }

    .tool-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.5px;
    }

    .domain-tag {
      font-size: 8px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 6px;
      border-radius: 3px;
      letter-spacing: 0.5px;
      background: rgba(0, 229, 255, 0.1);
      color: var(--primary);
      border: 1px solid rgba(0, 229, 255, 0.3);
      white-space: nowrap;
    }

    .domain-tag.flagship { background: rgba(255, 215, 0, 0.1); color: var(--gold); border-color: var(--gold); }
    .domain-tag.ai { background: rgba(168, 85, 247, 0.1); color: var(--purple); border-color: var(--purple); }
    .domain-tag.sec { background: rgba(255, 51, 85, 0.1); color: var(--red); border-color: var(--red); }
    .domain-tag.privacy { background: rgba(0, 255, 157, 0.1); color: var(--secondary); border-color: var(--secondary); }
    .domain-tag.dev { background: rgba(0, 229, 255, 0.1); color: var(--primary); border-color: var(--primary); }
    .domain-tag.web3 { background: rgba(255, 184, 0, 0.1); color: var(--yellow); border-color: var(--yellow); }
    .domain-tag.media { background: rgba(249, 115, 22, 0.1); color: #f97316; border-color: #f97316; }
    .domain-tag.infra { background: rgba(56, 189, 248, 0.1); color: #38bdf8; border-color: #38bdf8; }
    .domain-tag.vision { background: rgba(236, 72, 153, 0.1); color: #ec4899; border-color: #ec4899; }
    .domain-tag.docs { background: rgba(148, 163, 184, 0.1); color: #94a3b8; border-color: #94a3b8; }

    .tool-desc {
      font-size: 10px;
      color: var(--text-dim);
      line-height: 1.5;
      margin-bottom: 12px;
      flex-grow: 1;
    }

    .tool-recipe {
      font-size: 9px;
      color: #64748b;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-mono);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 10px;
    }

    .status-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-badge.ready {
      color: var(--secondary);
    }
    .status-badge.ready::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--secondary);
      box-shadow: 0 0 8px var(--secondary);
    }

    .status-badge.missing {
      color: var(--gold);
    }
    .status-badge.missing::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 6px var(--gold);
    }

    .btn-tool {
      padding: 5px 10px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid var(--border);
    }

    .btn-launch {
      background: rgba(0, 255, 157, 0.12);
      border-color: var(--secondary);
      color: var(--secondary);
    }
    .btn-launch:hover {
      background: var(--secondary);
      color: #000;
      box-shadow: 0 0 10px rgba(0, 255, 157, 0.4);
    }

    .btn-install {
      background: rgba(255, 215, 0, 0.12);
      border-color: var(--gold);
      color: var(--gold);
    }
    .btn-install:hover {
      background: var(--gold);
      color: #000;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }

    /* Curated Bundle Cards */
    .bundle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 18px;
      padding-bottom: 30px;
    }

    .bundle-card {
      background: var(--card);
      border: 1px solid var(--border-gold);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      transition: all 0.25s;
    }

    .bundle-card:hover {
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.25);
    }

    .b-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .b-tag {
      font-size: 9px;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 1px;
    }

    .b-count {
      font-size: 9px;
      color: var(--primary);
      font-weight: 700;
    }

    .b-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .b-desc {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .b-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 14px;
    }

    .b-chip {
      font-size: 9px;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      color: #94a3b8;
    }

    .b-progress-wrap {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
      border-radius: 3px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .b-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--secondary));
      transition: width 0.3s ease;
    }

    .b-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
    }

    /* Terminal Log Drawer */
    #log-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 290px;
      background: rgba(4, 7, 12, 0.96);
      border-top: 2px solid var(--gold);
      backdrop-filter: blur(20px);
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.85);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #log-drawer.active {
      transform: translateY(0);
    }

    .log-header {
      padding: 10px 20px;
      background: rgba(10, 16, 26, 0.95);
      border-bottom: 1px solid rgba(255, 215, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .log-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-bar-wrap {
      flex: 1;
      max-width: 440px;
      margin: 0 20px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border);
      border-radius: 4px;
      height: 12px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold), var(--primary));
      transition: width 0.2s ease;
      box-shadow: 0 0 12px var(--gold);
    }

    .progress-pct {
      font-size: 9px;
      font-weight: 700;
      color: var(--text);
      min-width: 100px;
    }

    .log-controls {
      display: flex;
      gap: 8px;
    }

    .btn-log {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 4px 8px;
      font-size: 9px;
      font-family: inherit;
      border-radius: 3px;
      cursor: pointer;
    }

    .btn-log:hover {
      color: var(--text);
      border-color: var(--primary);
    }

    .log-stream {
      flex: 1;
      padding: 12px 20px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: #cbd5e1;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      background: #020408;
      user-select: text;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand-section">
      <div class="brand-icon">☿</div>
      <div>
        <div class="brand-title">ZOTH TOOL NEXUS PRO</div>
        <div class="brand-sub">153+ CYBER ARSENAL & SOVEREIGN RUNTIMES</div>
      </div>
    </div>

    <div class="search-bar">
      <span style="color:var(--gold); font-size:12px;">🔍</span>
      <input type="text" id="search-input" class="search-input" placeholder="Search 153+ tools by name, command, or domain...">
    </div>

    <div class="header-actions">
      <button class="btn-action btn-master" id="btn-install-all" onclick="installAllMissing()">
        <span>⚡ ONE-CLICK: INSTALL ALL</span>
      </button>
      <button class="btn-action" onclick="fixPermissions()">
        <span>🛡 FIX PERMISSIONS</span>
      </button>
      <button class="btn-action" onclick="refreshTools()">
        <span>🔄 AUDIT / REFRESH</span>
      </button>
      <button class="btn-action" onclick="openTerminalTUI()">
        <span>🖥 TERMINAL TUI</span>
      </button>
    </div>
  </header>

  <!-- Telemetry Bar -->
  <div class="tele-bar">
    <div class="tele-metrics">
      <div class="tele-item">TOTAL TOOLS: <span class="tele-val" id="tele-total">0</span></div>
      <div class="tele-item">READY: <span class="tele-val green" id="tele-ready">0</span></div>
      <div class="tele-item">MISSING: <span class="tele-val gold" id="tele-missing">0</span></div>
      <div class="tele-item">HEALTH: <span class="tele-val" id="tele-health">0%</span></div>
    </div>

    <div class="status-filters">
      <span style="color:var(--text-dim); font-size:9px; margin-right:4px;">FILTER:</span>
      <button class="filter-chip active" id="filter-all" onclick="setStatusFilter('all')">ALL</button>
      <button class="filter-chip" id="filter-ready" onclick="setStatusFilter('ready')">READY ONLY</button>
      <button class="filter-chip" id="filter-missing" onclick="setStatusFilter('missing')">MISSING ONLY</button>
    </div>

    <div style="color:var(--text-dim); font-size:9px;">
      SYSTEM: <span style="color:var(--secondary)">Debian / ZothOS Ring-Gated</span> | HOST: <span style="color:var(--gold)">Sovereign Archon</span>
    </div>
  </div>

  <!-- Filter Tabs -->
  <div class="tabs-bar">
    <button class="tab-btn active" id="tab-all" onclick="switchTab('all')">ALL TOOLS</button>
    <button class="tab-btn" id="tab-bundles" onclick="switchTab('bundles')">⚡ CURATED BUNDLES</button>
    <button class="tab-btn" id="tab-flagship" onclick="switchTab('flagship')">🏛 FLAGSHIPS & CORE</button>
    <button class="tab-btn" id="tab-ai" onclick="switchTab('ai')">🧠 FRONTIER AI</button>
    <button class="tab-btn" id="tab-sec" onclick="switchTab('sec')">⚔ OFFENSIVE SEC</button>
    <button class="tab-btn" id="tab-privacy" onclick="switchTab('privacy')">🛡 PRIVACY & DEFENSE</button>
    <button class="tab-btn" id="tab-dev" onclick="switchTab('dev')">💻 POLYGLOT DEV</button>
    <button class="tab-btn" id="tab-web3" onclick="switchTab('web3')">⛓ WEB3 & BLOCKCHAIN</button>
    <button class="tab-btn" id="tab-media" onclick="switchTab('media')">🎨 MEDIA & 3D</button>
    <button class="tab-btn" id="tab-infra" onclick="switchTab('infra')">🌐 MESH & INFRA</button>
    <button class="tab-btn" id="tab-vision" onclick="switchTab('vision')">👁 VISION & OCR</button>
    <button class="tab-btn" id="tab-docs" onclick="switchTab('docs')">📚 DOCS & PKM</button>
  </div>

  <!-- Main View Grid -->
  <main id="main-content">
    <div class="matrix-grid" id="tools-grid">
      <!-- Tool cards populated dynamically -->
    </div>
  </main>

  <!-- Collapsible Terminal Progress Drawer -->
  <div id="log-drawer">
    <div class="log-header">
      <div class="log-title">
        <span id="log-icon">✦</span>
        <span id="log-title">PROVISIONING ARSENAL...</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="progress-pct" id="progress-text">0% (0/0)</div>
      <div class="log-controls">
        <button class="btn-log" onclick="clearLogs()">CLEAR</button>
        <button class="btn-log" onclick="toggleDrawer()">CLOSE</button>
      </div>
    </div>
    <div class="log-stream" id="log-body"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
