    <text x="18" y="54" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14.5" font-weight="700">Kokoro :9394 → Piper / espeak-ng</text>
    <text x="18" y="77" fill="#94A3B8" font-family="ui-monospace, Menlo, monospace" font-size="10.5">Zero cloud egress by default • Pure-Python PCM fallback</text>

    <rect x="372" y="0" width="352" height="98" rx="12" fill="#111421" stroke="#38BDF8" stroke-opacity="0.4"/>
