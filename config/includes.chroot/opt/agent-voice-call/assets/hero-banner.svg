    <line x1="39" y1="59" x2="39" y2="68" stroke="#08080B" stroke-width="4" stroke-linecap="round"/>
    <line x1="29" y1="68" x2="49" y2="68" stroke="#08080B" stroke-width="4" stroke-linecap="round"/>
