[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-voice-call"
version = "2.6.0"
description = "Zero-dependency local-first AI voice calling station (Kokoro / Piper / espeak-ng), persisted call debriefs, and JSON-RPC 2.0 stdio MCP server."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Neal Frazier Tech (@1nc0gn30) • NullAI Platform", email = "1nc0gn30@users.noreply.github.com"}
]
dependencies = []

[project.urls]
Homepage = "https://zoth.nullai.tech/tools/agent-voice-call"
Repository = "https://github.com/1nc0gn30/agent-voice-call"

[project.scripts]
agent-voice-call = "agent_voice_call.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
