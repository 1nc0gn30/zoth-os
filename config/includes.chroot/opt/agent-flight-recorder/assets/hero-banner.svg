<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070B"/>
      <stop offset="50%" stop-color="#0C101B"/>
      <stop offset="100%" stop-color="#07080E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)" stroke="#D4AF37" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <!-- Emblem -->
  <g transform="translate(52, 48)">
    <rect width="78" height="78" rx="18" fill="url(#accent)" opacity="0.92"/>
    <polygon points="39,14 62,27 62,51 39,64 16,51 16,27" fill="#08080B" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="39" cy="39" r="7" fill="#D4AF37"/>
  </g>

  <!-- Header Copy -->
  <g transform="translate(152, 62)">
