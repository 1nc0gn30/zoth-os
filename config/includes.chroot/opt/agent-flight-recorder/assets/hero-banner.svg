    <text x="18" y="30" fill="#D4AF37" font-family="ui-monospace, monospace" font-size="10" font-weight="700">PILLAR 01 // INTEGRITY</text>
    <text x="18" y="56" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">SHA-256 Hash-Chained WAL</text>
    <text x="18" y="78" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10.5">Tamper-evident events • /api/verify</text>

    <rect x="372" y="0" width="352" height="98" rx="12" fill="#101320" stroke="#38BDF8" stroke-opacity="0.38"/>
    <text x="390" y="30" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="10" font-weight="700">PILLAR 02 // RUNTIME</text>
    <text x="390" y="56" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Local Daemon • CLI • Stdio MCP</text>
    <text x="390" y="78" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10.5">Mode: LOCAL-DAEMON • Port :8104</text>

    <rect x="744" y="0" width="352" height="98" rx="12" fill="#101320" stroke="#D4AF37" stroke-opacity="0.38"/>
    <text x="762" y="30" fill="#D4AF37" font-family="ui-monospace, monospace" font-size="10" font-weight="700">PILLAR 03 // EXPORTS</text>
    <text x="762" y="56" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Offline HTML, JSON, CSV &amp; MD</text>
