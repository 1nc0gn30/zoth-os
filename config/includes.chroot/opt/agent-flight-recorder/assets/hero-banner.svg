  </g>

  <text x="600" y="298" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10.5">
    ENGINEERED BY NEAL FRAZIER TECH (@1nc0gn30)  •  NULLAI PLATFORM  •  ZOTH.NULLAI.TECH
