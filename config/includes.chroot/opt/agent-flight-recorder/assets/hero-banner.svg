    <text x="12" y="1" fill="#D4AF37" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1.1">AGENT FLIGHT RECORDER v2.6.0 // LOOPBACK 127.0.0.1:8104</text>
    <text x="0" y="34" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="0.4">AGENT FLIGHT RECORDER</text>
    <text x="0" y="60" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">Local Python black box recorder, SHA-256 hash-chained SQLite timeline, and stdio MCP forensics hub.</text>
  </g>

  <!-- 3 Feature Cards -->
