    <text x="18" y="56" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">HMAC-SHA256 + Path Normalization</text>
    <text x="18" y="78" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10.5">SQLite WAL • Quota Caps • Kill-Switch</text>

    <rect x="372" y="0" width="352" height="98" rx="12" fill="#101320" stroke="#38BDF8" stroke-opacity="0.4"/>
    <text x="390" y="30" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="10" font-weight="700">PILLAR 02 // RUNTIME &amp; MCP</text>
    <text x="390" y="56" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Local Daemon + 4-Tool Stdio MCP</text>
    <text x="390" y="78" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10.5">Mode: LOCAL DAEMON :8106 • Zero Deps</text>

    <rect x="744" y="0" width="352" height="98" rx="12" fill="#101320" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="762" y="30" fill="#10B981" font-family="ui-monospace, monospace" font-size="10" font-weight="700">PILLAR 03 // ECOSYSTEM</text>
