    <text x="12" y="1" fill="#F5E6AB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.1">SHIELD // LOCAL DAEMON :8106 // v2.6.0 // STDIO MCP</text>
    <text x="0" y="34" fill="#FFFFFF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="800" letter-spacing="0.4">AGENT POLICY AUDITOR</text>
    <text x="0" y="60" fill="#CBD5E1" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5">Time-bound HMAC-SHA256 capability lease broker, action verifier, and OWASP LLM manifest auditor.</text>
  </g>

