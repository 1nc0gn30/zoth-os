    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(212,175,55,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)" stroke="#D4AF37" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <!-- Shield Emblem -->
  <g transform="translate(52, 48)">
    <rect width="78" height="78" rx="18" fill="url(#accent)" opacity="0.95"/>
    <path d="M39 14 L60 23 V42 C60 54 51 62 39 67 C27 62 18 54 18 42 V23 Z" fill="#08080B" stroke="#F8FAFC" stroke-width="2"/>
    <path d="M31 40 L37 46 L48 33" fill="none" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Header Copy -->
