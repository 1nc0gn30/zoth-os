<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Zoth Bot</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #08080b;
        color: #f5e6ab;
        overflow: hidden;
      }
      #root { position: relative; height: 100%; }
      #stageHost { position: absolute; inset: 0; }
      #stage { width: 100%; height: 100%; display: block; }
      #line {
        position: absolute;
        left: 14%;
        right: 14%;
        bottom: 23%;
        margin: 0;
        text-align: center;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 13px;
        line-height: 1.35;
        color: #f5e6ab;
        text-shadow: 0 2px 10px #000;
        pointer-events: none;
      }
      #talk {
        position: absolute;
        left: 50%;
        bottom: 8%;
        transform: translateX(-50%);
        border: 1px solid #d4af37;
        background: rgba(8, 8, 11, 0.62);
        color: #f6d365;
        border-radius: 999px;
        padding: 9px 18px;
        letter-spacing: 0.22em;
        font: 11px/1 system-ui, sans-serif;
        text-transform: uppercase;
      }
      #talk:active { background: #d4af37; color: #08080b; }
    </style>
  </head>
  <body>
    <div id="root" class="mode-compact">
      <div id="stageHost" class="stage-host">
        <canvas id="stage" aria-label="Zoth"></canvas>
        <img id="stageFallback" src="./assets/zoth-guy.jpg" alt="" hidden />
      </div>
      <p id="line">Tap speak</p>
      <button id="talk" type="button">Speak</button>
    </div>
    <script type="module" src="stage.js"></script>
    <script type="module" src="watch.js"></script>
  </body>
</html>
