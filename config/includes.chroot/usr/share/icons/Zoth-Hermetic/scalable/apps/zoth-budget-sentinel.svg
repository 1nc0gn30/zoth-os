<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgBudget" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#071912"/>
      <stop offset="50%" stop-color="#040b08"/>
      <stop offset="100%" stop-color="#020403"/>
    </radialGradient>
    <linearGradient id="goldShieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="80%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="emeraldCoil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="rubyCoil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="rubyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgBudget)" stroke="url(#goldShieldRim)" stroke-width="8"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#d4af37" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 4"/>

  <!-- Golden Sentinel Aegis Shield -->
  <path d="M 256 100 L 376 152 C 376 280 294 366 256 404 C 218 366 136 280 136 152 Z" fill="#05100b" stroke="url(#goldShieldRim)" stroke-width="9" stroke-linejoin="round" filter="url(#goldGlow)"/>

  <!-- Emerald Active Budget Circuit Coil (Left) -->
  <path d="M 200 176 C 170 176 160 200 160 230 C 160 265 180 290 216 300 C 230 304 240 316 240 330 C 240 346 226 358 206 358 C 180 358 170 340 170 340" fill="none" stroke="url(#emeraldCoil)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#emeraldGlow)"/>
  <circle cx="200" cy="176" r="8" fill="#34d399" filter="url(#emeraldGlow)"/>
  <circle cx="200" cy="176" r="4" fill="#ffffff"/>

  <!-- Ruby Trip Circuit Coil (Right) -->
  <path d="M 312 176 C 342 176 352 200 352 230 C 352 265 332 290 296 300 C 282 304 272 316 272 330 C 272 346 286 358 306 358 C 332 358 342 340 342 340" fill="none" stroke="url(#rubyCoil)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#rubyGlow)"/>
  <circle cx="312" cy="176" r="8" fill="#f87171" filter="url(#rubyGlow)"/>
  <circle cx="312" cy="176" r="4" fill="#ffffff"/>

  <!-- Central Interceptor Bridge / Contact Switch -->
  <line x1="200" y1="256" x2="242" y2="256" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
  <line x1="270" y1="256" x2="312" y2="256" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  <!-- Breaker Knife Switch / Gate -->
  <line x1="242" y1="256" x2="268" y2="240" stroke="#d4af37" stroke-width="6" stroke-linecap="round" filter="url(#goldGlow)"/>

  <!-- Core Token Vault Emblem (Hexagonal Microchip / Vault Hub) -->
  <polygon points="256,198 286,215 286,249 256,266 226,249 226,215" fill="#0b2419" stroke="#d4af37" stroke-width="3"/>
  <circle cx="256" cy="232" r="10" fill="#fbbf24" filter="url(#goldGlow)"/>
  <circle cx="256" cy="232" r="4" fill="#ffffff"/>

  <!-- Terminal Contact Nodes -->
  <circle cx="242" cy="256" r="6" fill="#10b981"/>
  <circle cx="270" cy="256" r="6" fill="#ef4444"/>

  <!-- Bottom Apex Guard Node -->
  <circle cx="256" cy="404" r="6" fill="#fbbf24"/>
</svg>
