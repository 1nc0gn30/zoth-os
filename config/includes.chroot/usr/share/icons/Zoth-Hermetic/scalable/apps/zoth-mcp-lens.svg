<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgLens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#140f2b"/>
      <stop offset="60%" stop-color="#080714"/>
      <stop offset="100%" stop-color="#020106"/>
    </radialGradient>
    <linearGradient id="lensRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="apertureGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgLens)" stroke="url(#lensRim)" stroke-width="8"/>
  <circle cx="256" cy="256" r="184" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 6"/>

  <!-- Optical Lens Outer Ring -->
  <circle cx="256" cy="256" r="148" fill="#080718" stroke="url(#lensRim)" stroke-width="6"/>
  <circle cx="256" cy="256" r="130" fill="url(#apertureGlow)"/>

  <!-- Reticle Crosshairs / Calibration Ticks -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 8"/>
  <line x1="256" y1="90" x2="256" y2="120" stroke="#ffd700" stroke-width="3"/>
  <line x1="256" y1="392" x2="256" y2="422" stroke="#ffd700" stroke-width="3"/>
  <line x1="90" y1="256" x2="120" y2="256" stroke="#ffd700" stroke-width="3"/>
  <line x1="392" y1="256" x2="422" y2="256" stroke="#ffd700" stroke-width="3"/>

  <!-- Mechanical Aperture Blades (Stylized Pentagram/Hex Lens) -->
  <path d="M 256 160 L 320 220 L 290 280 L 220 280 L 192 220 Z" fill="#0e0b24" stroke="#a855f7" stroke-width="3"/>

  <!-- Central Prismatic Core / MCP Token Wave -->
  <circle cx="256" cy="256" r="38" fill="#170d38" stroke="#38bdf8" stroke-width="3" filter="url(#neonGlow)"/>
  <polygon points="256,230 278,268 234,268" fill="#ffd700"/>

  <!-- Protocol Data Stream Particles -->
  <circle cx="170" cy="180" r="5" fill="#38bdf8"/>
  <circle cx="342" cy="180" r="5" fill="#38bdf8"/>
  <circle cx="342" cy="332" r="5" fill="#34d399"/>
  <circle cx="170" cy="332" r="5" fill="#34d399"/>
</svg>
