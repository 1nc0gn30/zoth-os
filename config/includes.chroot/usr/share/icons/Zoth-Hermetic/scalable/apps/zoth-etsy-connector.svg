<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgConnector" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f252a"/>
      <stop offset="60%" stop-color="#051216"/>
      <stop offset="100%" stop-color="#010405"/>
    </radialGradient>
    <linearGradient id="goldCyanRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgConnector)" stroke="url(#goldCyanRim)" stroke-width="8"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 6"/>

  <!-- Etsy E / Marketplace Portal Knot -->
  <!-- Outer Tag Hexagon -->
  <polygon points="256,120 376,190 376,330 256,400 136,330 136,190" fill="#06181e" stroke="url(#goldCyanRim)" stroke-width="5"/>

  <!-- Tag Eyelet -->
  <circle cx="256" cy="165" r="14" fill="#010405" stroke="#d4af37" stroke-width="4"/>

  <!-- Ornate Stylized E (Etsy & Enclave) in Gold -->
  <path d="M 210 215 L 305 215 C 315 215 320 220 320 228 C 320 236 315 240 305 240 L 235 240 L 235 260 L 290 260 C 300 260 305 265 305 272 C 305 280 300 284 290 284 L 235 284 L 235 308 L 310 308 C 320 308 325 313 325 321 C 325 329 320 334 310 334 L 210 334 C 198 334 190 326 190 314 L 190 235 C 190 223 198 215 210 215 Z" fill="#ffd700" filter="url(#cyanGlow)"/>

  <!-- MCP Cable Nodes / Sync Indicators -->
  <circle cx="136" cy="260" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="376" cy="260" r="10" fill="#34d399" stroke="#ffffff" stroke-width="2"/>
  <line x1="90" y1="260" x2="136" y2="260" stroke="#38bdf8" stroke-width="4" stroke-dasharray="4 4"/>
  <line x1="376" y1="260" x2="422" y2="260" stroke="#34d399" stroke-width="4" stroke-dasharray="4 4"/>
</svg>
