<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#062624"/>
      <stop offset="60%" stop-color="#021413"/>
      <stop offset="100%" stop-color="#010707"/>
    </radialGradient>
    <linearGradient id="egressRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)" stroke="url(#egressRim)" stroke-width="8"/>
  <!-- Concentric Radar Sweeps -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00ff9d" stroke-width="2" stroke-opacity="0.2"/>
  <circle cx="256" cy="256" r="115" fill="none" stroke="#00ff9d" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#00ff9d" stroke-width="2.5" stroke-opacity="0.5"/>
  <!-- Crosshairs -->
  <line x1="256" y1="80" x2="256" y2="432" stroke="#00ff9d" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 6"/>
  <line x1="80" y1="256" x2="432" y2="256" stroke="#00ff9d" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 6"/>
  <!-- Radar Sweep Sector Beam -->
  <path d="M 256 256 L 375 145 A 160 160 0 0 0 256 96 Z" fill="url(#beamGrad)"/>
  <!-- Egress Directional Arrows (North, East, South, West Vector Pulses) -->
  <path d="M 256 120 L 246 138 L 266 138 Z" fill="#00ff9d" filter="url(#glow)"/>
  <path d="M 392 256 L 374 246 L 374 266 Z" fill="#00e5ff" filter="url(#glow)"/>
  <path d="M 256 392 L 266 374 L 246 374 Z" fill="#00ff9d" filter="url(#glow)"/>
  <path d="M 120 256 L 138 266 L 138 246 Z" fill="#00e5ff" filter="url(#glow)"/>
  <!-- Central Sentinel Lens -->
  <circle cx="256" cy="256" r="26" fill="#031f1d" stroke="#00e5ff" stroke-width="4"/>
  <circle cx="256" cy="256" r="14" fill="#00ff9d" filter="url(#glow)"/>
  <circle cx="260" cy="252" r="4" fill="#ffffff"/>
  <!-- Quarantined Packet Signal -->
  <circle cx="340" cy="180" r="7" fill="#fbbf24" filter="url(#glow)"/>
</svg>
