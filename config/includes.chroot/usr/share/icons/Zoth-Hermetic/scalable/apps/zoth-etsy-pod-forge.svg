<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgPod" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0f1d"/>
      <stop offset="60%" stop-color="#14060e"/>
      <stop offset="100%" stop-color="#050103"/>
    </radialGradient>
    <linearGradient id="goldRoseRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="roseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgPod)" stroke="url(#goldRoseRim)" stroke-width="8"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#f472b6" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 6"/>

  <!-- Botanical Canvas Easel & Frame -->
  <rect x="140" y="130" width="232" height="200" rx="16" fill="#180812" stroke="url(#goldRoseRim)" stroke-width="5"/>

  <!-- Wildflower Blossom Motif Inside Canvas -->
  <!-- Stem & Leaves -->
  <path d="M 256 310 Q 256 240 256 200" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <path d="M 256 260 Q 220 250 215 230 Q 235 240 256 255" fill="#10b981" opacity="0.8"/>
  <path d="M 256 245 Q 290 235 295 215 Q 275 225 256 240" fill="#10b981" opacity="0.8"/>

  <!-- Petals (Rose & Gold Watercolor) -->
  <circle cx="256" cy="190" r="28" fill="#fb7185" opacity="0.85" filter="url(#roseGlow)"/>
  <circle cx="236" cy="176" r="22" fill="#f472b6" opacity="0.75"/>
  <circle cx="276" cy="176" r="22" fill="#f472b6" opacity="0.75"/>
  <circle cx="256" cy="162" r="22" fill="#fda4af" opacity="0.85"/>
  <circle cx="256" cy="190" r="14" fill="#ffd700"/>

  <!-- Easel Legs -->
  <line x1="160" y1="330" x2="130" y2="410" stroke="#d4af37" stroke-width="6" stroke-linecap="round"/>
  <line x1="352" y1="330" x2="382" y2="410" stroke="#d4af37" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="330" x2="256" y2="415" stroke="#d4af37" stroke-width="5" stroke-linecap="round"/>
  <line x1="120" y1="350" x2="392" y2="350" stroke="#f5e6ab" stroke-width="4" stroke-linecap="round"/>
</svg>
