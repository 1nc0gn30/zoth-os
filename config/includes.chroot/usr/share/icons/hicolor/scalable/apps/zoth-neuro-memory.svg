<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="60%" stop-color="#0a0e1c"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <linearGradient id="neuroRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="synapseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)" stroke="url(#neuroRim)" stroke-width="8"/>
  <!-- Synaptic Graph Edges (Spreading Activation Matrix) -->
  <line x1="256" y1="140" x2="160" y2="210" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.6"/>
  <line x1="256" y1="140" x2="352" y2="210" stroke="#fbbf24" stroke-width="4" stroke-opacity="0.6"/>
  <line x1="160" y1="210" x2="140" y2="320" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.5"/>
  <line x1="160" y1="210" x2="256" y2="265" stroke="url(#synapseGrad)" stroke-width="5"/>
  <line x1="352" y1="210" x2="372" y2="320" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.5"/>
  <line x1="352" y1="210" x2="256" y2="265" stroke="url(#synapseGrad)" stroke-width="5"/>
  <line x1="140" y1="320" x2="210" y2="385" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.6"/>
  <line x1="372" y1="320" x2="302" y2="385" stroke="#fbbf24" stroke-width="4" stroke-opacity="0.6"/>
  <line x1="256" y1="265" x2="210" y2="385" stroke="#00f3ff" stroke-width="4" stroke-opacity="0.7"/>
  <line x1="256" y1="265" x2="302" y2="385" stroke="#fbbf24" stroke-width="4" stroke-opacity="0.7"/>
  <line x1="210" y1="385" x2="302" y2="385" stroke="url(#synapseGrad)" stroke-width="3" stroke-opacity="0.5"/>
  <!-- Synaptic Dendritic Nodes -->
  <circle cx="256" cy="140" r="18" fill="#081b33" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="256" cy="140" r="7" fill="#00f3ff" filter="url(#glow)"/>
  <circle cx="160" cy="210" r="22" fill="#081b33" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="160" cy="210" r="9" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="352" cy="210" r="22" fill="#261b07" stroke="#fbbf24" stroke-width="4"/>
  <circle cx="352" cy="210" r="9" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="140" cy="320" r="16" fill="#081b33" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="140" cy="320" r="6" fill="#00f3ff"/>
  <circle cx="372" cy="320" r="16" fill="#261b07" stroke="#fbbf24" stroke-width="3"/>
  <circle cx="372" cy="320" r="6" fill="#fbbf24"/>
  <circle cx="210" cy="385" r="18" fill="#081b33" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="210" cy="385" r="7" fill="#00f3ff" filter="url(#glow)"/>
  <circle cx="302" cy="385" r="18" fill="#261b07" stroke="#fbbf24" stroke-width="4"/>
  <circle cx="302" cy="385" r="7" fill="#fbbf24" filter="url(#glow)"/>
  <!-- Central Engram Hub (Biological Core) -->
  <circle cx="256" cy="265" r="38" fill="#0c1122" stroke="url(#neuroRim)" stroke-width="6"/>
  <circle cx="256" cy="265" r="18" fill="#00f3ff" filter="url(#glow)"/>
  <circle cx="256" cy="265" r="8" fill="#ffffff"/>
</svg>
