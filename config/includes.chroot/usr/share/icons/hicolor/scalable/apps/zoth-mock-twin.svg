<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241032"/>
      <stop offset="60%" stop-color="#12061b"/>
      <stop offset="100%" stop-color="#060209"/>
    </radialGradient>
    <linearGradient id="twinRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="quantumBridge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)" stroke="url(#twinRim)" stroke-width="8"/>
  <!-- Orbital Resonance Rings -->
  <ellipse cx="256" cy="256" rx="160" ry="80" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.3" transform="rotate(-25 256 256)"/>
  <ellipse cx="256" cy="256" rx="160" ry="80" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" transform="rotate(25 256 256)"/>
  <!-- Quantum Data Bridge -->
  <line x1="170" y1="256" x2="342" y2="256" stroke="url(#quantumBridge)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="170" y1="256" x2="342" y2="256" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 8"/>
  <!-- Left Twin Node (Primary / Real) -->
  <circle cx="170" cy="256" r="54" fill="#1a0b26" stroke="#c084fc" stroke-width="6"/>
  <polygon points="170,224 198,240 198,272 170,288 142,272 142,240" fill="none" stroke="#e879f9" stroke-width="3"/>
  <circle cx="170" cy="256" r="14" fill="#c084fc" filter="url(#glow)"/>
  <circle cx="170" cy="256" r="6" fill="#ffffff"/>
  <!-- Right Twin Node (Synthetic / Mock Twin) -->
  <circle cx="342" cy="256" r="54" fill="#0c1829" stroke="#38bdf8" stroke-width="6"/>
  <polygon points="342,224 370,240 370,272 342,288 314,272 314,240" fill="none" stroke="#22d3ee" stroke-width="3"/>
  <circle cx="342" cy="256" r="14" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="342" cy="256" r="6" fill="#ffffff"/>
  <!-- Synchronous Hologram Glyphs -->
  <path d="M 230 180 L 256 160 L 282 180" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 230 332 L 256 352 L 282 332" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
</svg>
