<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgPolicy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#160c28"/>
      <stop offset="60%" stop-color="#090514"/>
      <stop offset="100%" stop-color="#020106"/>
    </radialGradient>
    <linearGradient id="goldPurpleRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgPolicy)" stroke="url(#goldPurpleRim)" stroke-width="8"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 6"/>

  <!-- Policy Scroll / Shield Parchment -->
  <path d="M 160 120 L 352 120 C 374 120 392 138 392 160 L 392 340 C 392 380 256 420 256 420 C 256 420 120 380 120 340 L 120 160 C 120 138 138 120 160 120 Z" fill="#0c0717" stroke="url(#goldPurpleRim)" stroke-width="6"/>

  <!-- Scales of Policy & Governance Balance -->
  <!-- Central Beam -->
  <line x1="256" y1="160" x2="256" y2="340" stroke="#d4af37" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="160" r="12" fill="#a855f7" filter="url(#purpleGlow)"/>

  <!-- Horizontal Crossbar -->
  <line x1="170" y1="200" x2="342" y2="200" stroke="#f5e6ab" stroke-width="5" stroke-linecap="round"/>

  <!-- Left Scale Pan (Permissions) -->
  <line x1="180" y1="200" x2="160" y2="250" stroke="#a855f7" stroke-width="2"/>
  <line x1="180" y1="200" x2="200" y2="250" stroke="#a855f7" stroke-width="2"/>
  <path d="M 150 250 Q 180 270 210 250 Z" fill="#180e2b" stroke="#d4af37" stroke-width="3"/>
  <circle cx="180" cy="242" r="4" fill="#38bdf8"/>

  <!-- Right Scale Pan (Quotas & Invariants) -->
  <line x1="332" y1="200" x2="312" y2="250" stroke="#a855f7" stroke-width="2"/>
  <line x1="332" y1="200" x2="352" y2="250" stroke="#a855f7" stroke-width="2"/>
  <path d="M 302 250 Q 332 270 362 250 Z" fill="#180e2b" stroke="#d4af37" stroke-width="3"/>
  <circle cx="332" cy="242" r="4" fill="#10b981"/>

  <!-- Cryptographic Keyhole Base -->
  <circle cx="256" cy="280" r="18" fill="#a855f7" stroke="#d4af37" stroke-width="3" filter="url(#purpleGlow)"/>
  <polygon points="250,285 262,285 266,325 246,325" fill="#d4af37"/>
</svg>
