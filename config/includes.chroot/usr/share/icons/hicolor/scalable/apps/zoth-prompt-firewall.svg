<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#300d14"/>
      <stop offset="60%" stop-color="#160508"/>
      <stop offset="100%" stop-color="#050102"/>
    </radialGradient>
    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)" stroke="url(#shieldRim)" stroke-width="8"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 8"/>
  <!-- Cyber Firewall Shield -->
  <path d="M 256 110 L 370 160 C 370 280 290 360 256 395 C 222 360 142 280 142 160 Z" fill="#180408" stroke="url(#shieldRim)" stroke-width="10" stroke-linejoin="round"/>
  <!-- Defensive Firewall Grid Inside Shield -->
  <path d="M 180 200 L 332 200 M 170 250 L 342 250 M 184 300 L 328 300" stroke="#f43f5e" stroke-width="3" stroke-opacity="0.4"/>
  <path d="M 220 150 L 220 340 M 256 130 L 256 370 M 292 150 L 292 340" stroke="#f43f5e" stroke-width="3" stroke-opacity="0.4"/>
  <!-- Core Prompt Barrier Flame Glyph -->
  <path d="M 256 185 C 275 220 295 240 295 270 C 295 305 272 330 256 330 C 240 330 217 305 217 270 C 217 245 235 225 245 205 C 248 220 255 230 262 235 C 265 225 260 205 256 185 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  <!-- Central Sentinel Node -->
  <circle cx="256" cy="285" r="12" fill="#ffffff" filter="url(#glow)"/>
  <!-- Tactical Corner Anchors -->
  <circle cx="142" cy="160" r="5" fill="#f43f5e"/>
  <circle cx="370" cy="160" r="5" fill="#f43f5e"/>
  <circle cx="256" cy="395" r="5" fill="#fbbf24"/>
</svg>
