<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgCapsule" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1a15"/>
      <stop offset="60%" stop-color="#040b08"/>
      <stop offset="100%" stop-color="#010403"/>
    </radialGradient>
    <linearGradient id="goldEmeraldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="capsuleGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgCapsule)" stroke="url(#goldEmeraldRim)" stroke-width="8"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 6"/>

  <!-- Cylindrical Containment Capsule Enclosure -->
  <rect x="156" y="120" width="200" height="272" rx="100" fill="#040a08" stroke="url(#goldEmeraldRim)" stroke-width="6"/>

  <!-- Inner Force Field / Plasma Chamber -->
  <rect x="176" y="140" width="160" height="232" rx="80" fill="url(#capsuleGlow)" stroke="#10b981" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Hexagonal Security Shield Core -->
  <polygon points="256,190 296,214 296,262 256,286 216,262 216,214" fill="#02140e" stroke="#d4af37" stroke-width="4" filter="url(#emeraldGlow)"/>

  <!-- Central Enclave Lock Symbol -->
  <path d="M 244 234 L 244 226 C 244 219 250 214 256 214 C 262 214 268 219 268 226 L 268 234 M 238 234 L 274 234 C 277 234 279 236 279 239 L 279 260 C 279 263 277 265 274 265 L 238 265 C 235 265 233 263 233 260 L 233 239 C 233 236 235 234 238 234 Z" fill="#d4af37" stroke="#f5e6ab" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="256" cy="248" r="3" fill="#040a08"/>

  <!-- Magnetic Orbital Rings / Containment Latches -->
  <line x1="140" y1="200" x2="372" y2="200" stroke="#d4af37" stroke-width="3" stroke-dasharray="8 4"/>
  <line x1="140" y1="312" x2="372" y2="312" stroke="#d4af37" stroke-width="3" stroke-dasharray="8 4"/>

  <!-- Diagnostic Status Emitting Rays -->
  <circle cx="256" cy="100" r="10" fill="#10b981" filter="url(#emeraldGlow)"/>
  <circle cx="256" cy="412" r="10" fill="#10b981" filter="url(#emeraldGlow)"/>
</svg>
