version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: ci, include: scope }
  - package-ecosystem: npm
    directory: /config/includes.chroot/opt/maya-linux
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
  - package-ecosystem: npm
    directory: /config/includes.chroot/usr/share/hexstrike-ai/ui
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
  - package-ecosystem: pip
    directory: /config/includes.chroot/usr/share/hexstrike-ai/backend
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }

