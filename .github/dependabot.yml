version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: ci, include: scope }
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /config/includes.chroot/opt/maya-linux
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    groups:
      maya-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "electron-builder"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /config/includes.chroot/usr/share/hexstrike-ai/ui
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    groups:
      hexstrike-ui-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "globals"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /config/includes.chroot/usr/share/hexstrike-ai/backend
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    groups:
      hexstrike-backend:
        patterns: ["*"]
